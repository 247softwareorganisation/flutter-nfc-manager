# Caller for PLAT-895 stale-PR automation — flutter-nfc-manager.
# Weekly schedule (Monday 10:00 IST) + on-demand manual run with an optional dry-run.
name: Close stale PRs

on:
  schedule:
    - cron: '30 4 * * 1'   # weekly, Monday 10:00 IST (= 04:30 UTC)
  workflow_dispatch:
    inputs:
      debug-only:
        description: Dry run (log only — no comments or closes)
        type: boolean
        default: true

concurrency:
  group: close-stale-prs
  cancel-in-progress: false

jobs:
  close-stale-prs:
    uses: 247softwareorganisation/github-workflows/.github/workflows/close-stale-prs.yml@master
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: write
    with:
      debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-only || false }}
